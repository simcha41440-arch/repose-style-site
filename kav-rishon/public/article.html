<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>קו ראשון</title>
  <meta name="theme-color" content="#13284a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="article-layout">
    <article class="article" id="article">
      <div class="skeleton" style="height:60px;margin-bottom:16px"></div>
      <div class="skeleton" style="height:300px"></div>
    </article>
    <aside>
      <div class="side-box">
        <h2 class="section-title">עוד ידיעות</h2>
        <ol class="popular" id="more"></ol>
      </div>
    </aside>
  </main>

  <footer id="site-footer"></footer>

  <script src="/common.js"></script>
  <script>
  (async function () {
    const fromPath = location.pathname.match(/^\/article\/([^/]+)/);
    const slug = fromPath ? decodeURIComponent(fromPath[1]) : new URLSearchParams(location.search).get("slug");
    const el = document.getElementById("article");

    const { article: a } = slug ? await api({ slug }) : { article: null };
    renderChrome(a ? a.category : null);
    showDemoBanner();

    if (!a) {
      el.innerHTML = `<div class="empty">הידיעה לא נמצאה. <a href="/" style="text-decoration:underline">לעמוד הבית</a></div>`;
      return;
    }

    document.title = `${a.title} | קו ראשון`;
    setMeta("description", a.summary || a.subtitle || "");
    setMeta("og:title", a.title, true);
    setMeta("og:description", a.subtitle || a.summary || "", true);

    const url = location.origin + articleUrl(a);
    const shareText = `${a.title}\n${url}`;
    const paragraphs = String(a.body || "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean);

    el.innerHTML = `
      <a class="cat" href="/?cat=${esc(a.category)}">${esc(CATEGORIES[a.category] || "")}</a>
      ${a.city ? `<span class="meta"><span class="dot">·</span><a href="/?city=${encodeURIComponent(a.city)}">${esc(a.city)}</a></span>` : ""}
      <h1>${esc(a.title)}</h1>
      ${a.subtitle ? `<p class="lead">${esc(a.subtitle)}</p>` : ""}
      <div class="byline">
        <span class="meta">מערכת קו ראשון<span class="dot">·</span>${esc(new Date(a.published_at).toLocaleString("he-IL", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }))}</span>
        <div class="share">
          <a href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">וואטסאפ</a>
          <a href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(a.title)}" target="_blank" rel="noopener">טלגרם</a>
          <button type="button" id="copy">העתקת קישור</button>
        </div>
      </div>
      ${a.image_url ? `<figure><img src="${esc(a.image_url)}" alt=""></figure>` : ""}
      ${a.impact ? `<div class="impact"><strong>מה זה אומר עליך?</strong><p>${esc(a.impact)}</p></div>` : ""}
      <div class="body">${paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      ${a.source_name ? `<p class="source">מקור: ${a.source_url ? `<a href="${esc(a.source_url)}" target="_blank" rel="noopener nofollow">${esc(a.source_name)}</a>` : esc(a.source_name)}</p>` : ""}`;

    document.getElementById("copy").addEventListener("click", async (e) => {
      try { await navigator.clipboard.writeText(url); e.target.textContent = "הקישור הועתק ✓"; } catch {}
    });

    const { articles = [] } = await api({ limit: 8 });
    document.getElementById("more").innerHTML = articles
      .filter((x) => x.slug !== a.slug).slice(0, 6)
      .map((x) => `<li><a href="${articleUrl(x)}">${esc(x.title)}</a></li>`).join("");

    function setMeta(name, content, og) {
      const attr = og ? "property" : "name";
      let m = document.querySelector(`meta[${attr}="${name}"]`);
      if (!m) { m = document.createElement("meta"); m.setAttribute(attr, name); document.head.appendChild(m); }
      m.setAttribute("content", content);
    }
  })();
  </script>
</body>
</html>
